function home(){return `<header class="bar"><div class="wrap nav"><div class="brand"><b>Minwown</b> | Ticketing Assistance</div><nav class="links"><a href="#events">Concerts</a><a href="#how">How It Works</a><a href="#faq">FAQ</a><a href="#contact">Contact</a><a href="#" onclick="trackPage();return false">Track My Order</a></nav><button class="btn primary" onclick="start()">Order Now →</button></div></header><main><section class="hero"><div class="wrap hero-grid"><div><span class="eyebrow">🎟️ Independent Ticketing Assistance</span><h1>Your concert ticket, made simple.</h1><p>Choose your event, select your preferred ticket category, pay through QRPH, and submit your request through a guided mobile-first process.</p><div class="actions"><button class="btn primary" onclick="start()">Order a Ticket →</button><a class="btn light" href="#events">View Concerts</a></div></div></div></section><section id="events"><div class="wrap"><div class="head"><div><h2>Available Concerts</h2><p>Choose an event to see ticket categories and ₱ pricing.</p></div></div><div class="grid">${EVENTS.map(c=>`<article class="card"><div class="poster"><img src="${IMAGES[c.img]}" alt="${esc(c.title)}"><span class="tag">Ticketing Assistance</span></div><div class="body"><div class="artist">${esc(c.artist)}</div><h3>${esc(c.title)}</h3><div class="meta">📍 ${esc(c.venue)}<br>📅 ${esc(c.date)}</div><button class="btn primary block" onclick="order('${c.id}')">Order Ticket →</button></div></article>`).join('')}</div></div></section><section id="how"><div class="wrap"><div class="head"><div><h2>How It Works</h2><p>Same clean four-step flow you requested.</p></div></div><div class="how"><div><div class="num">1</div><h3>Choose your concert</h3><p>Select the event, date, ticket category and quantity.</p></div><div><div class="num">2</div><h3>Pay via QRPH</h3><p>Scan the QR and enter your payment details.</p></div><div><div class="num">3</div><h3>Review</h3><p>Double-check every detail before submitting.</p></div><div><div class="num">4</div><h3>Agree & Submit</h3><p>Accept the terms and receive your order reference.</p></div></div></div></section><section id="faq"><div class="wrap"><div class="head"><div><h2>FAQ</h2><p>Quick answers before ordering.</p></div></div><div class="faq"><details><summary>What payment method do you accept?</summary><p>QRPH only. The payment recipient displayed is Jeffrey Tuagnon.</p></details><details><summary>Can I request a specific seat?</summary><p>Yes. You can enter a preferred section, row or seat. Specific seats remain subject to availability unless confirmed.</p></details><details><summary>Is my ticket guaranteed after I submit?</summary><p>No. Submission starts the request/review process. Final ticket availability and confirmation are subject to availability.</p></details><details><summary>Can I upload proof of payment?</summary><p>Yes. The payment step supports image uploads for your proof of payment.</p></details></div></div></section><section id="contact"><div class="wrap"><div class="box" style="text-align:center"><h2 style="margin:0 0 7px">Ready to order?</h2><p style="color:var(--muted)">Choose a concert and the 4-step order flow will open.</p><button class="btn primary" onclick="start()">Start an Order →</button></div></div></section></main><footer><div class="wrap"><div class="brand"><b>Minwown</b> | Ticketing Assistance</div><p>Independent ticketing assistance service. Not affiliated with artists, labels, venues, or official ticketing platforms unless explicitly stated.</p></div></footer>`}
function progress(){return `<div class="progress">${['Concert','Payment','Review','Agree'].map((x,i)=>`<div class="ps ${s.step===i+1?'active':s.step>i+1?'done':''}"><div class="ball">${s.step>i+1?'✓':i+1}</div><small>${x}</small></div>`).join('')}</div>`}
function orderPage(){let c=ev();return `<header class="bar"><div class="wrap nav"><button class="btn light" onclick="goHome()">←</button><div class="brand"><b>Minwown</b> | Ticketing Assistance</div><span style="font-weight:900;color:var(--muted)">${s.step}/4</span></div></header><main class="wrap order"><div class="order-top"><div><div class="brand">Minwown</div></div></div>${progress()}${step(c)}</main><div class="bottom"><div class="bottom-in">${s.step>1?'<button class="btn light back" onclick="prev()">‹</button>':''}<button class="btn primary continue" onclick="next()">${s.step===4?'✓ Agree & Submit':'Continue →'}</button></div></div>`}
function step(c){if(s.step===1)return `<div class="box"><div class="title"><h2>🎤 Concert & Ticket</h2><p>Choose your event and ticket type</p></div><div class="note">✨ Select your concert, ticket category, preferred date and ticket details before continuing.</div><div class="field"><label>Concert Name <em>*</em></label><div class="choices">${EVENTS.map(x=>`<button class="choice ${s.event===x.id?'selected':''}" onclick="pickEvent('${x.id}')"><strong>${esc(x.title)}</strong><small>${esc(x.city)} • ${esc(x.date)}</small><div class="price">from ${x.prices[0][1]}</div></button>`).join('')}</div></div>${c?`<div class="field"><label>Ticket Category <em>*</em></label><div class="choices">${c.prices.map(p=>`<button class="choice ${s.cat===p[0]?'selected':''}" onclick="pickCat('${esc(p[0])}')"><strong>${esc(p[0])}</strong><div class="price">${p[1]}</div></button>`).join('')}</div></div><div class="field"><label>Concert Date <em>*</em></label><input id="date" value="${esc(s.date||c.date)}"></div><div class="field"><label>Ticket Quantity <em>*</em></label><div style="display:flex;gap:8px"><button class="btn light" onclick="qty(-1)">−</button><input id="qty" value="${s.qty}" inputmode="numeric" style="max-width:100px;text-align:center"><button class="btn light" onclick="qty(1)">+</button></div></div><div class="field"><label>Preferred Section / Seat</label><input id="seat" value="${esc(s.seat)}" placeholder="e.g. Section 112, Row B, Seat 14"></div><div class="field"><label>Ticket Details <em>*</em></label><textarea id="details" placeholder="e.g. VIP / CAT 1 / preferred section / any available seat">${esc(s.details)}</textarea></div>`:''}</div>`;
if(s.step===2)return `<div class="box"><div class="title"><h2>💳 Payment Details</h2><p>How you paid for this order</p></div><div class="ticket-mini"><img src="${IMAGES[c.img]}"><div><div class="artist">${esc(c.artist)}</div><h3>${esc(c.title)}</h3><p>${esc(c.venue)}</p><p>${esc(s.cat)} × ${s.qty}</p><div class="money">${price()}</div></div></div><div class="pay"><span class="eyebrow">📱 QRPH ONLY</span><br><img class="qr" src="${CFG.qrImage}" alt="QRPH"><div class="qrname">${CFG.qrName}</div><div style="color:var(--muted);font-size:12px;margin-top:3px">Scan to pay via QRPH</div><div class="note" style="text-align:left">Please verify the recipient name <b>Jeffrey Tuagnon</b> before sending payment.</div></div><div class="field"><label>Amount Paid <em>*</em></label><input id="amount" value="${esc(s.amount)}" placeholder="₱0" inputmode="decimal"></div><div class="field"><label>Date Paid <em>*</em></label><input id="paidDate" type="date" value="${s.paidDate}"></div><div class="field"><label>Time Paid <em>*</em></label><input id="paidTime" type="time" value="${s.paidTime}"></div><div class="field"><label>Reference Number <em>*</em></label><input id="ref" value="${esc(s.ref)}" placeholder="Transaction reference number"></div><div class="field"><label>Proof of Payment <em>*</em></label><label class="upload" for="proof">↥<strong>Tap to upload screenshot(s)</strong><span>PNG, JPG up to 25MB</span><input id="proof" type="file" accept="image/png,image/jpeg" multiple></label><div class="thumbs">${s.proofs.map(x=>`<img src="${x}">`).join('')}</div></div></div>`;
if(s.step===3)return `<div class="box"><div class="title"><h2>📋 Review Order</h2><p>Double-check everything before sending</p></div><div class="note">📋 Review all details carefully. Tap Edit to go back and make changes.</div><div class="review"><div class="rh"><span>CONCERT & TICKET</span><button onclick="edit(1)">✎ Edit</button></div><div class="rb">${kv('CONCERT',c.title)}${kv('DATE',s.date||c.date)}${kv('TICKET CATEGORY',s.cat)}${kv('QUANTITY',s.qty)}${kv('PREFERRED SEAT',s.seat||'Any available')}${kv('TICKET DETAILS',s.details)}</div></div><div class="review"><div class="rh"><span>PAYMENT</span><button onclick="edit(2)">✎ Edit</button></div><div class="rb">${kv('METHOD','QRPH')}${kv('RECIPIENT',CFG.qrName)}${kv('AMOUNT PAID',s.amount?'₱'+s.amount:'—')}${kv('DATE PAID',s.paidDate)}${kv('TIME PAID',s.paidTime)}${kv('REFERENCE #',s.ref)}</div></div><div class="review"><div class="rh"><span>PROOF OF PAYMENT (${s.proofs.length})</span><button onclick="edit(2)">✎ Edit</button></div><div class="rb"><div class="thumbs">${s.proofs.map(x=>`<img src="${x}">`).join('')}</div></div></div></div>`;
return `<div class="box"><div class="title"><h2>📜 Terms & Agreement</h2><p>Read and agree to proceed</p></div><div class="field"><label>Where did you find us? <em>*</em></label><select id="source"><option value="">Select source</option>${['Facebook','Instagram','TikTok','Telegram','Friend / Referral','Google','Other'].map(x=>`<option ${s.source===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><div class="terms"><h3>MINWOWN TICKETING ASSISTANCE — TERMS & CONDITIONS</h3><h3>1. SERVICE DISCLOSURE</h3><p>Minwown Ticketing Assistance provides ticket purchasing assistance and coordination services. Ticket availability is not guaranteed until an order is confirmed.</p><h3>2. TICKET AVAILABILITY</h3><p>Submitting an order does not automatically guarantee a ticket. Availability depends on the selected event, ticket category, venue inventory and applicable ticketing channels.</p><h3>3. PAYMENT</h3><p>Customers must verify the payment recipient before sending payment. QRPH recipient: <b>Jeffrey Tuagnon</b>.</p><h3>4. ORDER INFORMATION</h3><p>Customers are responsible for providing accurate concert, ticket, contact, payment and reference information.</p><h3>5. SEAT REQUESTS</h3><p>Preferred sections or seats are requests unless a specific seat has been successfully secured and confirmed.</p><h3>6. PROCESSING</h3><p>Submitted orders are reviewed and processed based on availability and information provided.</p><h3>7. REFUNDS / CANCELLATIONS</h3><p>Refunds and cancellations are subject to the circumstances of the order, applicable ticketing rules and Minwown service terms.</p><h3>8. EVENT CHANGES</h3><p>Schedules, venues, prices, seating arrangements and event policies may change at the direction of the event organizer.</p><h3>9. CUSTOMER RESPONSIBILITY</h3><p>The customer must review all information before confirming the order.</p></div></div><label class="check"><input id="agree" type="checkbox" ${s.agree?'checked':''}><span><b>I have read and agree to ALL Terms and Conditions above.</b></span></label></div>`}
function start(){s.page='order';s.step=1;render()}function order(id){s.page='order';s.step=1;s.event=id;s.cat=null;s.date='';render()}function goHome(){s.page='home';render()}function pickEvent(id){s.event=id;s.cat=null;s.date='';render()}function pickCat(x){s.cat=x;render()}function qty(d){s.qty=Math.max(1,s.qty+d);render()}function capture(){[['date','date'],['qty','qty'],['seat','seat'],['details','details'],['amount','amount'],['paidDate','paidDate'],['paidTime','paidTime'],['ref','ref'],['source','source']].forEach(([id,key])=>{let e=document.getElementById(id);if(e)s[key]=id==='qty'?Math.max(1,parseInt(e.value||1)):e.value});let a=document.getElementById('agree');if(a)s.agree=a.checked}function valid(){capture();if(s.step===1)return s.event&&s.cat&&s.date&&s.details;if(s.step===2)return s.amount&&s.paidDate&&s.paidTime&&s.ref&&s.proofs.length;if(s.step===4)return s.source&&s.agree;return true}function next(){if(!valid()){alert('Please complete all required fields before continuing.');return}if(s.step<4){s.step++;render()}else{ s.orderRef='MIN-'+Math.random().toString(36).slice(2,8).toUpperCase();localStorage.setItem('minwown_order_'+s.orderRef,JSON.stringify({...s,createdAt:new Date().toISOString()}));s.page='success';render()}}function prev(){capture();s.step--;render()}function edit(x){capture();s.step=x;render()}function render(){document.getElementById('app').innerHTML=s.page==='home'?home():s.page==='order'?orderPage():s.page==='track'?track():success();bind();scrollTo(0,0)}function bind(){let f=document.getElementById('proof');if(f)f.onchange=e=>{[...e.target.files].slice(0,15).forEach(file=>{let r=new FileReader();r.onload=()=>{s.proofs.push(r.result);render()};r.readAsDataURL(file)})};let a=document.getElementById('agree');if(a)a.onchange=()=>s.agree=a.checked}function trackPage(){s.page='track';render()}
function trackOrder(){let r=(document.getElementById('trackRef')?.value||'').trim().toUpperCase();let raw=r?localStorage.getItem('minwown_order_'+r):null;let box=document.getElementById('trackResult');if(!box)return;if(!r){box.innerHTML='<div class="note">Please enter your order reference.</div>';return}if(!raw){box.innerHTML='<div class="note"><b>Order not found.</b><br>Check your reference number and try again.</div>';return}let o=JSON.parse(raw),c=EVENTS.find(x=>x.id===o.event);box.innerHTML=`<div class="summary"><h3>ORDER FOUND</h3>${kv('ORDER REFERENCE',r)}${kv('CONCERT',c?.title||'—')}${kv('TICKET CATEGORY',o.cat||'—')}${kv('QUANTITY',o.qty||1)}${kv('AMOUNT PAID',o.amount?'₱'+o.amount:'—')}${kv('STATUS','Pending Review')}</div><div class="note">Your payment is being reviewed. Please keep your order reference for support.</div>`}
function track(){return `<header class="bar"><div class="wrap nav"><div class="brand"><b>Minwown</b> | Ticketing Assistance</div><nav class="links"><a href="#" onclick="goHome();return false">Home</a><a href="#" onclick="trackPage();return false">Track My Order</a></nav><button class="btn primary" onclick="start()">Order Now →</button></div></header><main class="wrap order"><div class="box" style="max-width:680px;margin:35px auto"><div class="title"><h2>Track My Order</h2><p>Enter your order reference to check your latest status.</p></div><div class="field"><label>Order Reference <em>*</em></label><input id="trackRef" placeholder="e.g. MIN-ABC123" autocomplete="off"></div><button class="btn primary block" style="margin-top:14px" onclick="trackOrder()">Track Order →</button><div id="trackResult"></div><button class="btn light block" style="margin-top:10px" onclick="goHome()">Back to Home</button></div></main>`}
function success(){let c=ev();return `<header class="bar"><div class="wrap nav"><div class="brand"><b>Minwown</b> | Ticketing Assistance</div><button class="btn light" onclick="goHome()">Home</button></div></header><main class="wrap success"><div class="success-icon">✓</div><h1>Order Confirmed! 🎟️</h1><p style="color:var(--muted);font-size:16px">Your order has been received and is now being reviewed.</p><div class="ref"><small>YOUR ORDER REFERENCE</small><code>${s.orderRef}</code><button class="btn light" style="float:right" onclick="navigator.clipboard?.writeText('${s.orderRef}');alert('Order reference copied.')">Copy</button><div style="clear:both;color:var(--muted);font-size:11px;margin-top:6px">Save this reference for support.</div></div><div class="summary"><h3>ORDER SUMMARY</h3>${kv('CONCERT',c.title)}${kv('TICKET CATEGORY',s.cat)}${kv('QUANTITY',s.qty)}${kv('AMOUNT PAID',s.amount?'₱'+s.amount:'—')}${kv('STATUS','Pending Review')}</div><div class="summary"><h3>WHAT HAPPENS NEXT</h3>${kv('1. Payment Review',"We'll verify your payment details.")}${kv('2. Order Processing','Your request will be processed based on availability.')}${kv('3. Ticket Update',"You'll receive an update once processed.")}</div><button class="btn primary block" style="margin-top:16px" onclick="goHome()">Back to Minwown →</button></main>`}
